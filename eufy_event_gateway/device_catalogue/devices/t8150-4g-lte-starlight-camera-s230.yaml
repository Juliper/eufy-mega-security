# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8150
name: 4G LTE Starlight Camera (S230)
category: camera
integration:
  status: ready_to_test
  handler: camera
models:
  - T8150
  - T8151
  - T8152
  - T8153
device_type: 110
notes: >-
  Hardware evidence is from T8151 in EU/DE on gateway 0.1.255 with a shared guest
  account. Inventory reports battery parameters 1101, 2111, and 1138, and push
  event 3101 is received. Camera admission, motion/person delivery to Home
  Assistant, live view over LTE/PPCS relay, and snapshots still need hardware
  confirmation. Other listed model variants have not been hardware-verified.
capabilities:
  readable:
    battery_level:
      connections:
        direct:
          status: reported
          notes: T8151 EU/DE gateway diagnostics report battery.level (parameter 1101); value accuracy is unverified.
      read:
        parameter: 1101
    battery_charging:
      connections:
        direct:
          status: reported
          notes: T8151 EU/DE gateway diagnostics report battery.charging (parameter 2111); charging transitions are unverified.
      read:
        parameter: 2111
    battery_temperature:
      connections:
        direct:
          status: reported
          notes: T8151 EU/DE gateway diagnostics report battery.temperature (parameter 1138); value accuracy is unverified.
      read:
        parameter: 1138
    last_charging_days:
      connections:
        direct:
          status: declared
      read:
        field: charging_days
  controls:
    enabled:
      connections:
        direct:
          status: declared
      read:
        parameter: 1035
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    siren:
      connections:
        direct:
          status: declared
      requires_parameter: 1015
      write:
        command: 1202
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren.
  media:
    live_view:
      connections:
        direct:
          status: declared
    snapshot:
      connections:
        direct:
          status: declared
  events:
    motion:
      connections:
        direct:
          status: declared
    person:
      connections:
        direct:
          status: declared
    pet:
      connections:
        direct:
          status: declared
    vehicle:
      connections:
        direct:
          status: declared
    sound:
      connections:
        direct:
          status: declared
